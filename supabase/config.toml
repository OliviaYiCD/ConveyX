# ConveyX local Supabase project
# Run: supabase start (requires Supabase CLI + Docker)

project_id = "conveyx"

[api]
enabled = true
port = 54321
schemas = ["public", "customer", "identity"]
extra_search_path = ["public", "customer", "identity"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Email testing (replaces deprecated [inbucket] section)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5174"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[seed]
sql_paths = ["./seed.sql"]
